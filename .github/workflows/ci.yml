name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-locked, wheels-only, one file for every OS and Python in the matrix. Regenerate with
      #   uv pip compile .github/requirements/ci.in --universal --python-version 3.10 \
      #     --generate-hashes --only-binary :all: -o .github/requirements/ci.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt

      # je_action_core has no dependencies and is not on PyPI yet (ActionCore progress.md #1), so it cannot be
      # in the hash-locked ci.txt; install it from GitHub at a fixed commit until it is.
      - name: Install je_action_core
        run: |
          pip install --no-deps "je_action_core @ git+https://github.com/Integration-Automation/ActionCore@4f5e88d57690a3a675816a46033bf488432b2cb1"

      # PySide6's Qt libraries load these at import; the Ubuntu runner image lacks libEGL.so.1 at least.
      # The list is the ELF NEEDED entries of QtGui, QtWidgets and the offscreen plugin outside the base system.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libx11-6 libxkbcommon0 libfontconfig1 libfreetype6

      # The tests import the checked-out source, not a published package. APITESTKA_REQUIRE_QT turns a
      # failed PySide6 import into an error, so the GUI widget tests cannot silently skip in CI.
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          APITESTKA_REQUIRE_QT: "1"
        run: python -m pytest test/ -v
