name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-locked, wheels-only, one file for every OS and Python in the matrix. Regenerate with
      #   uv pip compile .github/requirements/ci.in --universal --python-version 3.10 \
      #     --generate-hashes --only-binary :all: -o .github/requirements/ci.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt

      # PySide6's Qt libraries load these at import; the Ubuntu runner image lacks libEGL.so.1 at least.
      # The list is the ELF NEEDED entries of QtGui, QtWidgets and the offscreen plugin outside the base system.
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libx11-6 libxkbcommon0 libfontconfig1 libfreetype6

      # The tests import the checked-out source, not a published package. APITESTKA_REQUIRE_QT turns a
      # failed PySide6 import into an error, so the GUI widget tests cannot silently skip in CI.
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          APITESTKA_REQUIRE_QT: "1"
        run: python -m pytest test/ -v

  publish-dev:
    # The dev channel. A push to dev that passes the tests is built from dev.toml and uploaded when
    # it is still the tip of dev and ships something the newest je_api_testka_dev does not.
    # scripts/dev_release.py picks the version from PyPI, so nothing is committed back.
    # This workflow also runs for main, pull requests and the schedule: the condition keeps those out.
    name: Publish je_api_testka_dev to PyPI
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    concurrency:
      group: publish-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Hash-locked and wheels-only, like the test job: this job holds the PyPI token. Regenerate with
      #   uv pip compile .github/requirements/publish.in --generate-hashes --python-version 3.12 \
      #     --python-platform x86_64-manylinux_2_28 --only-binary :all: --exclude-newer 2026-09-24 \
      #     -o .github/requirements/publish.txt
      # (--exclude-newer keeps the 7-day wait Dependabot applies; move the date when regenerating)
      - name: Install build tooling
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt

      - name: Write pyproject.toml from dev.toml with the next version
        run: python scripts/dev_release.py prepare

      # --no-isolation: the backend is the setuptools locked in publish.txt, not a fresh download.
      - name: Build distribution
        run: python -m build --no-isolation

      - name: Verify distribution metadata
        run: python -m twine check dist/*

      - name: Compare with the newest published wheel
        id: compare
        run: python scripts/dev_release.py changed dist

      # A run that finishes after a newer push would otherwise publish older code as the newest release.
      - name: Check that this commit is still the tip of dev
        id: tip
        run: |
          tip="$(git ls-remote origin refs/heads/dev | cut -f1)"
          if [ "$tip" = "$GITHUB_SHA" ]; then current=true; else current=false; fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.compare.outputs.changed == 'true' && steps.tip.outputs.current == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
