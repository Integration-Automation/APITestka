name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Hash-locked, wheels-only, one file for every OS and Python in the matrix. Regenerate with
      #   uv pip compile .github/requirements/ci.in --universal --python-version 3.10       #     --generate-hashes --only-binary :all: -o .github/requirements/ci.txt
      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt

      # The tests import the checked-out source, not a published package.
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest test/ -v
