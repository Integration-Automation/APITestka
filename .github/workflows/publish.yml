name: Publish to PyPI

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # this job pushes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Hash-locked and wheels-only, the same file as the publish-dev job of ci.yml: this job holds the
      # PyPI token. Regenerate with
      #   uv pip compile .github/requirements/publish.in --generate-hashes --python-version 3.12 \
      #     --python-platform x86_64-manylinux_2_28 --only-binary :all: -o .github/requirements/publish.txt
      - name: Install build tooling
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt

      - name: Bump patch version in pyproject.toml
        id: bump
        run: |
          python <<'EOF'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find version in pyproject.toml")
          major, minor, patch = (int(part) for part in match.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          new_text = re.sub(
              r'^(version\s*=\s*)"\d+\.\d+\.\d+"',
              rf'\1"{new_version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          path.write_text(new_text, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"new_version={new_version}\n")
          print(f"Bumped version -> {new_version}")
          EOF

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" \
            dist/* \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --generate-notes
